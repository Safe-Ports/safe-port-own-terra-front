name: CI

# Corre en cada PR y en cada push a las ramas que se despliegan. La regla que hace
# útil esto: en GitHub, marcar "test" como required status check en la protección de
# la rama main, para que un PR con tests rojos no se pueda mergear.
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  # Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene sentido
  # gastar minutos validando un commit que ya quedó atrás.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 trae npm 11, el mismo con el que se genera el package-lock en
          # local. Con npm 10 aquí y npm 11 en local, el CI rechazaba locks válidos.
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        # `npm ci` (no `npm install`): instala exactamente el package-lock, igual
        # que hacen los scripts de deploy.
        run: npm ci

      - name: Revisar el árbol de dependencias
        # npm 11 instala sin quejarse un lock con versiones que no cumplen lo que
        # piden los paquetes (pasó con esbuild 0.21 donde vitest pide 0.27+).
        # `npm ls` falla en ese caso, antes de que rompa en un deploy.
        run: npm ls --all > /dev/null

      - name: Tests
        run: npm test

      - name: Build
        # El build es parte de la validación: rompe ante imports inexistentes o
        # sintaxis inválida que los tests no tocan. VITE_API_URL es obligatoria en
        # modo producción (ver vite.config.js); aquí solo necesita ser válida.
        env:
          VITE_API_URL: https://ci.invalid/api/v1
          VITE_PROPERTIES_API_URL: https://ci.invalid/api/v1
        run: npm run build
